name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://8882888.github.io/smart-bunny-homepage' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Download official nationwide legal-dong CSV
        run: |
          mkdir -p data
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 30 --max-time 240 \
            'https://www.data.go.kr/cmm/cmm/fileDownload.do?atchFileId=FILE_000000003687312&fileDetailSn=1' \
            --output data/official_legal_dong.csv
          test "$(wc -c < data/official_legal_dong.csv)" -gt 100000
          head -n 1 data/official_legal_dong.csv
      - name: Import nationwide regions
        run: python tools/import_official_regions.py
      - name: Validate imported nationwide region data
        run: python tools/validate_region_data.py
      - name: Validate completed trip records
        run: python tools/validate_completed_trips.py
      - name: Generate public completed-trip review page
        run: python tools/generate_reviews.py
      - name: Generate regional pages
        run: python tools/generate_pages.py
      - name: Configure canonical URLs and custom-domain paths
        run: python tools/configure_site.py
      - name: Validate generated pages and sitemap
        run: python tools/validate_site.py
      - name: Audit region pages and search index
        run: python tools/audit_site.py
      - name: Set up Node for browser script validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript and fare search behavior
        run: |
          node tools/validate_javascript.cjs
          node tests/fare_search.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
